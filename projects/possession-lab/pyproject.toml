[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "possession-lab"
version = "0.1.0"
description = "Local public and synthetic possession inference preparation"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy==2.5.4", "pandas==3.1.0", "matplotlib==3.10.8"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
possession-lab = "possession_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]
