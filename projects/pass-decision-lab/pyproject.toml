[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pass-decision-lab"
version = "0.1.0"
description = "Endpoint-free pass context models and cautious visible-target experiments"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2",
  "streamlit>=1.50,<2", "mplsoccer>=1.4,<2", "plotly>=6,<8", "matplotlib>=3.9,<4"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
[project.scripts]
passlab = "passlab.pipeline:main"
[tool.setuptools.packages.find]
include = ["passlab*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires locally downloaded real StatsBomb data"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
