[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lane-obstruction"
version = "0.1.0"
description = "Interpretable ground-pass lane obstruction proxies on SkillCorner Open Data"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "Pillow>=10,<14"]

[tool.setuptools.packages.find]
include = ["lane_obstruction*"]
