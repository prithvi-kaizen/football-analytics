[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "possession-danger"
version = "0.1.0"
description = "Possession volume and attacking value in StatsBomb's free women's leagues"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "pandas>=2.2,<4", "requests>=2.32,<3", "streamlit>=1.45,<2", "plotly>=6,<7", "mplsoccer>=1.4,<2", "matplotlib>=3.10,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
possession-danger = "possession_danger.cli:main"

[tool.setuptools.packages.find]
include = ["possession_danger*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["real_data: checks downloaded StatsBomb data, no network"]
