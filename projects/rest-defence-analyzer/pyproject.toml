[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rest-defence-analyzer"
version = "0.1.0"
description = "Tracking-native rest defence and bounded transition analysis on the open DFL dataset"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "mplsoccer>=1.4,<2", "plotly>=6,<7", "streamlit>=1.45,<2", "pyarrow>=18", "requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["rest_defence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["real: uses the bundled real DFL data, no network"]
