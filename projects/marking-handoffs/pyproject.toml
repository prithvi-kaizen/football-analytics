[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "marking-handoffs"
version = "0.1.0"
description = "Candidate defensive responsibility transfers from public broadcast tracking"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pillow>=11,<14"]

[project.optional-dependencies]
figures = ["matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
include = ["marking_handoffs*"]
