[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tacticai-lite"
version = "0.1.0"
description = "Reproducible corner-kick analysis with StatsBomb events and partial 360 frames"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "requests>=2.32,<3", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4", "mplsoccer>=1.4,<2", "plotly>=5.24,<7", "streamlit>=1.40,<2", "threadpoolctl>=3.5,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
tacticai-lite = "tacticai_lite.cli:main"

[tool.setuptools.packages.find]
include = ["tacticai_lite*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["real_data: requires the locally downloaded StatsBomb matches"]
